name: Release

# This workflow is the manual cross-platform publish path. It builds both
# platform artifacts from one existing release tag and publishes them through
# one job so uploads cannot race each other. The local macOS script remains
# available for a Mac-only build or local notarization validation.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to build and attach artifacts to (e.g. v0.2.5)
        required: true
        type: string
      allow_unsigned_windows:
        description: Publish an unsigned Windows NSIS installer for an explicitly approved compatibility release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check package/Cargo/Tauri versions agree with tag
        shell: bash
        run: bash scripts/check-version.sh "${{ inputs.tag }}"

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Build the signed and notarized macOS bundle
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --bundles dmg,app

      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(app/src-tauri/target/release/bundle/macos/*.app)
          if (( ${#apps[@]} == 0 )); then
            echo "no macOS app bundle was produced" >&2
            exit 1
          fi
          for app_bundle in "${apps[@]}"; do
            if [[ "$(plutil -extract LSUIElement raw -o - "$app_bundle/Contents/Info.plist")" != "true" ]]; then
              echo "macOS bundle is missing LSUIElement=true: $app_bundle" >&2
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app_bundle"
            spctl --assess --type execute --verbose=2 "$app_bundle"
            xcrun stapler validate "$app_bundle"
          done

      - name: Prepare macOS release artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(app/src-tauri/target/release/bundle/dmg/*.dmg)
          if (( ${#dmgs[@]} != 1 )); then
            echo "expected exactly one macOS DMG, found ${#dmgs[@]}" >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            checksum="${dmg}.sha256"
            (
              cd "$(dirname "$dmg")"
              shasum -a 256 "$(basename "$dmg")" > "$(basename "$checksum")"
              shasum -a 256 --check "$(basename "$checksum")"
            )
          done

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/dmg/*.dmg.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check package/Cargo/Tauri versions agree with tag
        shell: bash
        run: bash scripts/check-version.sh "${{ inputs.tag }}"

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Import Windows code-signing certificate
        if: ${{ inputs.allow_unsigned_windows == false }}
        shell: pwsh
        env:
          EISEN_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          EISEN_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          EISEN_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $required = @(
            "EISEN_WINDOWS_CERTIFICATE_BASE64",
            "EISEN_WINDOWS_CERTIFICATE_PASSWORD",
            "EISEN_WINDOWS_CERTIFICATE_THUMBPRINT"
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Missing required Windows signing secret: $name"
            }
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "eisen-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:EISEN_WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString $env:EISEN_WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          Remove-Item -LiteralPath $pfxPath -Force
          $expectedThumbprint = ($env:EISEN_WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $actualThumbprint = ($certificate.Thumbprint -replace '\s', '').ToUpperInvariant()
          if ($actualThumbprint -ne $expectedThumbprint) {
            throw "Imported Windows signing certificate thumbprint does not match the configured thumbprint"
          }

      - name: Build the signed Windows NSIS bundle
        if: ${{ inputs.allow_unsigned_windows == false }}
        working-directory: app
        shell: pwsh
        env:
          EISEN_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $thumbprint = ($env:EISEN_WINDOWS_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $env:TAURI_CONFIG = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Compress
          npm run tauri -- build --bundles nsis

      - name: Build the unsigned Windows NSIS bundle (compatibility path)
        if: ${{ inputs.allow_unsigned_windows == true }}
        working-directory: app
        shell: pwsh
        run: npm run tauri -- build --bundles nsis --no-sign

      - name: Verify Windows Authenticode signatures
        if: ${{ inputs.allow_unsigned_windows == false }}
        shell: pwsh
        run: |
          $binaries = @(Get-ChildItem "app/src-tauri/target/release/bundle" -Recurse -File -Filter *.exe)
          if ($binaries.Count -eq 0) {
            throw "No Windows executable was produced"
          }
          foreach ($binary in $binaries) {
            $signature = Get-AuthenticodeSignature -LiteralPath $binary.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($binary.Name): $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "No signer certificate found for $($binary.Name)"
            }
          }

      - name: Verify unsigned Windows compatibility artifact
        if: ${{ inputs.allow_unsigned_windows == true }}
        shell: pwsh
        run: |
          $binaries = @(Get-ChildItem "app/src-tauri/target/release/bundle" -Recurse -File -Filter *.exe)
          if ($binaries.Count -eq 0) {
            throw "No Windows executable was produced"
          }
          foreach ($binary in $binaries) {
            $signature = Get-AuthenticodeSignature -LiteralPath $binary.FullName
            if ($signature.Status -ne "NotSigned") {
              throw "Expected an unsigned compatibility artifact, got $($signature.Status) for $($binary.Name)"
            }
          }

      - name: Prepare Windows release artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "app/src-tauri/target/release/bundle/nsis" -File -Filter *.exe)
          if ($installers.Count -eq 0) {
            throw "No Windows NSIS installer was produced"
          }
          foreach ($installer in $installers) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii -NoNewline
            $check = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
            if ($hash -ne $check) {
              throw "Checksum changed while preparing $($installer.Name)"
            }
          }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sha256
          if-no-files-found: error

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release metadata
        id: release_metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release/macos

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release/windows

      - name: Verify release payload checksums
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find release/macos -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$(find release/windows -maxdepth 1 -name '*.exe' -print -quit)"
          (
            cd release/macos
            sha256sum -c -- *.dmg.sha256
          )
          (
            cd release/windows
            sha256sum -c -- *.exe.sha256
          )

      - name: Publish the cross-platform release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: EiSen ${{ steps.release_metadata.outputs.version }}
          body: |
            ## What's Changed in EiSen ${{ steps.release_metadata.outputs.version }}

            EiSen v${{ steps.release_metadata.outputs.version }} is a cross-platform release for macOS and Windows. macOS is distributed as a signed and notarized DMG. Windows users should prefer the Microsoft Store listing; this GitHub release includes the direct NSIS compatibility fallback.

            ### ✨ Highlights & Improvements
            - **Cross-platform distribution:** macOS and Windows artifacts are published together from the same release tag.
            - **Windows Store:** The Microsoft Store listing is now live at https://apps.microsoft.com/detail/9NRLQNXFVBF8 and is the recommended Windows installation path.
            - **Windows hotkey resilience:** EiSen prefers PrintScreen and automatically switches to Ctrl + Shift + 5 when another application already owns it, so capture remains available after installation.
            - **Release integrity:** Every downloadable artifact includes a matching SHA-256 sidecar verified before publication.
            - **Windows installer status:** ${{ inputs.allow_unsigned_windows && 'UNSIGNED compatibility release. Windows SmartScreen may show Unknown publisher or Windows protected your PC; managed devices may block it. Verify the published SHA-256 sidecar before running.' || 'Authenticode-signed release. Verify the published SHA-256 sidecar before running.' }}

            ### 🔐 Checksums
            - Verify the matching `.sha256` sidecar before installing. The sidecar is published next to each DMG and Windows installer.

            EiSen does not include a background auto-updater. Download future versions from the official GitHub Releases page or eisen.a302.link.
          files: |
            release/macos/*.dmg
            release/macos/*.dmg.sha256
            release/windows/*.exe
            release/windows/*.exe.sha256
          fail_on_unmatched_files: true
